services:
  postgres:
    image: postgres:16-alpine
    container_name: cocomama-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cocomama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cocomama"]
      interval: 5s
      timeout: 5s
      retries: 20

  voice:
    build:
      context: ./voice.cocomama
    container_name: cocomama-voice
    restart: unless-stopped
    environment:
      VOICE_GATEWAY_HOST: 0.0.0.0
      VOICE_GATEWAY_PORT: 8010
      VOICE_STT_MODEL: "${VOICE_STT_MODEL:-tiny.en}"
      VOICE_STT_DEVICE: "${VOICE_STT_DEVICE:-cpu}"
      VOICE_STT_COMPUTE_TYPE: "${VOICE_STT_COMPUTE_TYPE:-int8}"
      VOICE_STT_CPU_THREADS: "${VOICE_STT_CPU_THREADS:-4}"
      KOKORO_BASE_URL: "${KOKORO_BASE_URL:-http://host.docker.internal:8880}"
      VOICE_TTS_DEFAULT_VOICE: "${VOICE_TTS_DEFAULT_VOICE:-af_sky}"
    ports:
      - "8010:8010"
    volumes:
      - ./voice.cocomama/models:/app/models
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server.cocomama
    container_name: cocomama-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      voice:
        condition: service_started
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/cocomama
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-development-only-cocomama-auth-secret-change-me}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:3000}"
      BETTER_AUTH_TRUSTED_ORIGINS: "${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:3000}"
      AUTH_EMAIL_MODE: "${AUTH_EMAIL_MODE:-console}"
      AUTH_STORAGE_MODE: database
      AUTH_OTP_BYPASS_CODE: "${AUTH_OTP_BYPASS_CODE:-111111}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-Cocomama <no-reply@localhost>}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://integrate.api.nvidia.com/v1}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}"
      LLM_TEMPERATURE: "${LLM_TEMPERATURE:-1}"
      LLM_TOP_P: "${LLM_TOP_P:-0.95}"
      LLM_MAX_TOKENS: "${LLM_MAX_TOKENS:-4096}"
      LLM_ENABLE_THINKING: "${LLM_ENABLE_THINKING:-true}"
      LLM_REASONING_BUDGET: "${LLM_REASONING_BUDGET:-2048}"
      LLM_PROVIDER_RETRY_ATTEMPTS: "${LLM_PROVIDER_RETRY_ATTEMPTS:-1}"
      VOICE_GATEWAY_BASE_URL: http://voice:8010
      VOICE_GATEWAY_TIMEOUT_MS: "${VOICE_GATEWAY_TIMEOUT_MS:-30000}"
      VOICE_MAX_AUDIO_BYTES: "${VOICE_MAX_AUDIO_BYTES:-8388608}"
      VOICE_TTS_DEFAULT_VOICE: "${VOICE_TTS_DEFAULT_VOICE:-af_sky}"
      IDEMPOTENCY_WINDOW_SECONDS: "${IDEMPOTENCY_WINDOW_SECONDS:-60}"
      MAX_TOOL_ITERATIONS: "${MAX_TOOL_ITERATIONS:-6}"
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  client:
    build:
      context: ./client.cocomama
    container_name: cocomama-client
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      API_BASE_URL: http://backend:4000
      NEXT_PUBLIC_API_BASE_URL: http://backend:4000
    ports:
      - "3000:3000"

volumes:
  postgres-data:
